# Canaan K230 family (RISC-V 64-bit)
#
# K230 is a dual-core C910 RISC-V SoC with NPU, manufactured by Canaan/Kendryte.
# Uses a custom boot layout:
#   offset 1M    (LBA 2048) : fn_u-boot-spl.bin
#   offset 0x180000 (LBA 3072) : fn_u-boot-spl.bin (copy 2)
#   offset 0x1e0000 (LBA 4000) : env.env
#   offset 2M    (LBA 4096) : fn_u-boot.img
#   offset 0x380000 (LBA 7168) : env.env (copy 2)
#   offset 30M  (LBA 61440) : boot partition (ext4, 80M)
#   offset 128M (LBA 262144) : rootfs partition (ext4)
#
# Sources from the Canaan K230 Linux SDK:
#   https://github.com/kendryte/k230_linux_sdk
#   https://github.com/ruyisdk/linux-xuantie-kernel
#   https://github.com/u-boot/u-boot (tag:2022.10)
#   https://github.com/riscv-software-src/opensbi (tag:v1.4)
#

declare -g ARCH="riscv64"

# ---------------------------------------------------------------------------
# Kernel
# ---------------------------------------------------------------------------

# Canaan's Xuantie kernel fork with K230 support (based on Linux 6.6).
declare -g LINUXFAMILY="k230"
declare -g KERNEL_COMPILER="riscv64-linux-gnu-"

case "${BRANCH}" in
	edge)
		declare -g KERNEL_MAJOR_MINOR="6.6"
		declare -g KERNELSOURCE='https://github.com/ruyisdk/linux-xuantie-kernel.git'
		declare -g KERNELBRANCH="commit:7d4e1f444f461dbe3833bd99a4640e7b6c2cd529"
		declare -g KERNELPATCHDIR="archive/k230-6.6"
		declare -g LINUXCONFIG="linux-k230-edge"
		;;
	*)
		exit_with_error "k230: unsupported BRANCH" "${BRANCH}"
		;;
esac

declare -g GOVERNOR="performance"
declare -g SERIALCON="ttyS0"

# ---------------------------------------------------------------------------
# U-Boot (upstream v2022.10 + Canaan overlay)
# ---------------------------------------------------------------------------

# The K230 SDK uses upstream u-boot v2022.10 + a full overlay with K230 support.
# The overlay is rsync'd during pre_config_uboot_target__.
declare -g BOOTSOURCE='https://github.com/u-boot/u-boot.git'
declare -g BOOTBRANCH='tag:v2022.10'
declare -g BOOTPATCHDIR="u-boot-k230"
declare -g BOOTDIR='u-boot-k230'
declare -g UBOOT_COMPILER="riscv64-linux-gnu-"
declare -g UBOOT_HASH_EXTRA="${UBOOT_HASH_EXTRA:-} k230-overlay"

# The K230 SDK produces three u-boot binaries:
#   fn_u-boot-spl.bin  - SPL (raw write)
#   fn_u-boot.img   - main u-boot (raw write)
#   env.env            - u-boot env (mkimage-wrapped)
declare -g UBOOT_TARGET_MAP=";;u-boot-spl-k230.bin fn_u-boot.img env.env"

# ---------------------------------------------------------------------------
# OpenSBI (ATF equivalent for RISC-V)
# ---------------------------------------------------------------------------

# OpenSBI v1.4, generic platform, FW_TEXT_START=0, FW_PAYLOAD=kernel Image.
# Produces fw_jump.bin, which is then wrapped by u-boot mkimage to
# create fw_jump_add_uboot_head.bin (placed on boot partition).
declare -g ATFSOURCE='https://github.com/riscv-software-src/opensbi.git'
declare -g ATFDIR='opensbi'
declare -g ATFBRANCH='tag:v1.4'
declare -g ATF_COMPILER='riscv64-linux-gnu-'
#
# The Canaan SDK applies an opensbi-1.4-overlay on top of upstream v1.4
# (buildroot-overlay/boot/opensbi/opensbi-1.4-overlay). Without it, the T-Head
# C910 MAEE (memory attribute extension) stays enabled and the kernel crashes
# in early S-mode MMU setup - silent boot. Converted to patch form here.
declare -g ATFPATCHDIR="atf-k230"
#
# Keep the generic platform defaults (FW_JUMP_ADDR=FW_TEXT_START+0x200000,
# FW_JUMP_FDT_ADDR=FW_TEXT_START+0x2200000). fw_jump passes the dtb at
# 0x2200000 - exactly where the blinux env loads k.dtb, and u-boot fixes the
# bootargs into that original copy. Verified working against the Canaan SDK.
declare -g ATF_TARGET_MAP="PLATFORM=generic FW_TEXT_START=0 ;;build/platform/generic/firmware/fw_jump.bin"

# ---------------------------------------------------------------------------
# Partition layout
# ---------------------------------------------------------------------------

declare -g IMAGE_PARTITION_TABLE="gpt"
declare -g BOOTFS_TYPE="ext4"
declare -g BOOTSIZE="98"  # 30M offset + 98M boot = 128M, rootfs at 128M

function pre_prepare_partitions__k230_gpt_layout() {
	declare -g OFFSET="30"
	display_alert "K230" "GPT layout: raw writes 1M-3M, boot at 30M, rootfs at 128M" "info"
}

# ---------------------------------------------------------------------------
# U-Boot overlay rsync (runs before config/compile of each u-boot target)
# ---------------------------------------------------------------------------

# The K230 u-boot SDK is NOT a git fork with patches; it's a full overlay
# that rsync's files into the upstream u-boot tree. This hook handles that.
function pre_config_uboot_target__k230_overlay() {
	declare overlay="${SRC}/packages/bsp/k230/uboot-overlay"

	display_alert "K230" "rsync'ing u-boot overlay into build directory" "info"
	run_host_command_logged rsync -a "${overlay}/" "./"

	# The K230 overlay's Makefile and board files handle fn_u-boot-spl.bin
	# and fn_u-boot.img generation automatically via the build system.
	display_alert "K230" "u-boot overlay installed (${uboot_target_counter})" "info"
	return 0
}

# ---------------------------------------------------------------------------
# U-Boot postprocess: generate env.env
# ---------------------------------------------------------------------------

# env.env is generated from default.env using u-boot's mkenvimage tool.
# Called after u-boot is compiled, before packaging.
function uboot_custom_postprocess__k230_env() {
	local mkenvimage=""
	local env_src="${SRC}/packages/bsp/k230/default.env"

	# Try multiple possible locations for mkenvimage
	for candidate in \
		"${SRC}/cache/sources/u-boot-worktree/u-boot-k230/v2022.10/tools/mkenvimage" \
		"${SRC}/cache/sources/u-boot-k230/tools/mkenvimage" \
	; do
		[[ -x "${candidate}" ]] && { mkenvimage="${candidate}"; break; }
	done

	if [[ -z "${mkenvimage}" ]] && command -v mkenvimage &>/dev/null; then
		mkenvimage="mkenvimage"
	fi

	if [[ -z "${mkenvimage}" ]]; then
		display_alert "K230" "mkenvimage not found - cannot generate env.env" "err"
		return 1
	fi

	if [[ -f "${env_src}" ]]; then
		display_alert "K230" "generating env.env from default.env" "info"
		run_host_command_logged "${mkenvimage}" -s 0x10000 -o "env.env" "${env_src}"
	fi
}

# ---------------------------------------------------------------------------
# write_uboot_platform - write raw boot binaries to image
# ---------------------------------------------------------------------------

# Called during image creation; writes SPL, env, and u-boot at raw offsets.
function write_uboot_platform() {
	local uboot_dir="${1}"
	local device="${2}"
	local rc=0

	: "${uboot_dir:?}"
	: "${device:?}"

	display_alert "K230" "writing SPL at offset 1M (LBA 2048)" "info"
	dd if="${uboot_dir}/u-boot-spl-k230.bin" of="${device}" bs=512 seek=2048 conv=notrunc || rc=1

	display_alert "K230" "writing SPL at offset 0x180000 (LBA 3072)" "info"
	dd if="${uboot_dir}/u-boot-spl-k230.bin" of="${device}" bs=512 seek=3072 conv=notrunc || rc=1

	# env.env generation (if not already done by uboot_custom_postprocess)
	local env_file="${uboot_dir}/env.env"
	if [[ ! -f "${env_file}" ]]; then
		local mkenvimage=""
		for candidate in \
			"${SRC}/cache/sources/u-boot-worktree/u-boot-k230/v2022.10/tools/mkenvimage" \
			"${SRC}/cache/sources/u-boot-k230/tools/mkenvimage" \
		; do
			[[ -x "${candidate}" ]] && { mkenvimage="${candidate}"; break; }
		done
		if [[ -z "${mkenvimage}" ]] && command -v mkenvimage &>/dev/null; then
			mkenvimage="mkenvimage"
		fi
		if [[ -n "${mkenvimage}" ]]; then
			display_alert "K230" "generating env.env for write_uboot_platform" "info"
			run_host_command_logged "${mkenvimage}" -s 0x10000 -o "${env_file}" "${SRC}/packages/bsp/k230/default.env" || rc=1
		fi
	fi

	display_alert "K230" "writing env.env at offset 0x1e0000 (LBA 3840)" "info"
	[[ -f "${env_file}" ]] && dd if="${env_file}" of="${device}" bs=512 seek=3840 conv=notrunc || rc=1

	display_alert "K230" "writing u-boot at offset 2M (LBA 4096)" "info"
	dd if="${uboot_dir}/fn_u-boot.img" of="${device}" bs=512 seek=4096 conv=notrunc || rc=1

	display_alert "K230" "writing env.env at offset 0x380000 (LBA 7168)" "info"
	[[ -f "${env_file}" ]] && dd if="${env_file}" of="${device}" bs=512 seek=7168 conv=notrunc || rc=1

	return "${rc}"
}

# ---------------------------------------------------------------------------
# Boot partition: copy OpenSBI fw_jump.bin + wrap with mkimage
# ---------------------------------------------------------------------------

# Places fw_jump_add_uboot_head.bin and env.env on the boot partition.
function post_family_tweaks_bsp__k230_boot_partition() {
	local destination="${1}"
	local bootdir="${destination}/boot"
	mkdir -p "${bootdir}"

	# Copy env.env to boot partition (mkenvimage output lives in the u-boot worktree)
	local env_file=""
	for candidate in \
		"${SRC}/cache/sources/u-boot-worktree/u-boot-k230/v2022.10/env.env" \
		"${SRC}/cache/sources/u-boot-k230/v2022.10/env.env" \
	; do
		[[ -f "${candidate}" ]] && { env_file="${candidate}"; break; }
	done
	[[ -n "${env_file}" ]] && cp "${env_file}" "${bootdir}/env.env"

	# Generate fw_jump_add_uboot_head.bin:
	# OpenSBI fw_jump.bin + u-boot mkimage header.
	local fw_jump=""
	for candidate in \
		"${SRC}/cache/sources/opensbi/v1.4/build/platform/generic/firmware/fw_jump.bin" \
		"${SRC}/cache/sources/opensbi/build/platform/generic/firmware/fw_jump.bin" \
	; do
		[[ -f "${candidate}" ]] && { fw_jump="${candidate}"; break; }
	done

	if [[ -n "${fw_jump}" && -f "${fw_jump}" ]]; then
		local mkimage=""
		for cand in \
			"${SRC}/cache/sources/u-boot-worktree/u-boot-k230/v2022.10/tools/mkimage" \
			"${SRC}/cache/sources/u-boot-k230/v2022.10/tools/mkimage" \
		; do
			[[ -x "${cand}" ]] && { mkimage="${cand}"; break; }
		done
		[[ -z "${mkimage}" ]] && command -v mkimage &>/dev/null && mkimage="mkimage"

		if [[ -n "${mkimage}" ]]; then
			display_alert "K230" "wrapping OpenSBI fw_jump.bin with u-boot header" "info"
			run_host_command_logged "${mkimage}" -A riscv -O linux -T kernel -C none -a 0 -e 0 -n linux -d "${fw_jump}" "${bootdir}/fw_jump_add_uboot_head.bin"
		else
			display_alert "K230" "mkimage not found - cannot wrap fw_jump.bin" "warn"
		fi
	else
		display_alert "K230" "fw_jump.bin not found (OpenSBI not built with kernel payload)" "warn"
	fi
}

# Prepare the K230 boot partition files. blinux does:
#   ext4load mmc 1:1 0x3000000 fw_jump_add_uboot_head.bin
#   ext4load mmc 1:1 0x200000  Image
#   ext4load mmc 1:1 0x2200000 k.dtb
# Image is installed by the kernel package; k.dtb and fw_jump_add_uboot_head.bin
# must be provided here. Done in this hook (not post_family_tweaks_bsp) because
# the BSP artifact gets cached and its hook would be skipped.
function post_install_kernel_debs__k230_boot_files() {
	local bootdir="${SDCARD}/boot"
	mkdir -p "${bootdir}"

	# 1) k.dtb
	local dtb_src="${bootdir}/dtb/${BOOT_FDT_FILE}"
	if [[ -f "${dtb_src}" ]]; then
		display_alert "K230" "copying ${BOOT_FDT_FILE} as k.dtb" "info"
		cp "${dtb_src}" "${bootdir}/k.dtb"
	else
		display_alert "K230" "dtb not found: ${dtb_src}" "err"
	fi

	# 2) env.env (convenience copy onto the boot partition)
	local env_file=""
	for cand in \
		"${SRC}/cache/sources/u-boot-worktree/u-boot-k230/v2022.10/env.env" \
		"${SRC}/cache/sources/u-boot-k230/v2022.10/env.env" \
	; do
		[[ -f "${cand}" ]] && { env_file="${cand}"; break; }
	done
	[[ -n "${env_file}" ]] && cp "${env_file}" "${bootdir}/env.env"

	# 3) fw_jump_add_uboot_head.bin = OpenSBI fw_jump.bin wrapped with a mkimage header
	local fw_jump=""
	for cand in \
		"${SRC}/cache/sources/opensbi/v1.4/build/platform/generic/firmware/fw_jump.bin" \
		"${SRC}/cache/sources/u-boot-worktree/u-boot-k230/v2022.10/fw_jump.bin" \
		"${SRC}/cache/sources/opensbi/build/platform/generic/firmware/fw_jump.bin" \
	; do
		[[ -f "${cand}" ]] && { fw_jump="${cand}"; break; }
	done

	if [[ -n "${fw_jump}" ]]; then
		local mkimage=""
		for cand in \
			"${SRC}/cache/sources/u-boot-worktree/u-boot-k230/v2022.10/tools/mkimage" \
			"${SRC}/cache/sources/u-boot-k230/v2022.10/tools/mkimage" \
		; do
			[[ -x "${cand}" ]] && { mkimage="${cand}"; break; }
		done
		[[ -z "${mkimage}" ]] && command -v mkimage &>/dev/null && mkimage="mkimage"

		if [[ -n "${mkimage}" ]]; then
			display_alert "K230" "wrapping ${fw_jump} into fw_jump_add_uboot_head.bin" "info"
			run_host_command_logged "${mkimage}" -A riscv -O linux -T kernel -C none -a 0 -e 0 -n linux -d "${fw_jump}" "${bootdir}/fw_jump_add_uboot_head.bin" || \
				display_alert "K230" "failed to wrap fw_jump.bin" "err"
		else
			display_alert "K230" "mkimage not found - cannot wrap fw_jump.bin" "err"
		fi
	else
		display_alert "K230" "fw_jump.bin not found - OpenSBI not built" "err"
	fi
}

# ---------------------------------------------------------------------------
# Console setup
# ---------------------------------------------------------------------------

declare -g DEFAULT_CONSOLE="serial"
declare -g SERIALCON="ttyS0:115200"
